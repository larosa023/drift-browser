<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>AI</title>
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; connect-src drift:; style-src 'unsafe-inline'; script-src 'unsafe-inline'; img-src data:">
<style>
  :root { --accent: #ff6a3d; }
  body.dark { --bg: #1b1b20; --fg: #ececf1; --muted: #8d8d99; --card: #24242b; --hover: rgba(255,255,255,.05); --line: rgba(255,255,255,.08); --chip: rgba(255,255,255,.06); --field: rgba(255,255,255,.05); --code: rgba(0,0,0,.35); }
  body.light { --bg: #fafafb; --fg: #1c1c22; --muted: #6b6b76; --card: #ffffff; --hover: rgba(0,0,0,.04); --line: rgba(0,0,0,.08); --chip: rgba(0,0,0,.05); --field: rgba(0,0,0,.035); --code: rgba(0,0,0,.05); }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body { font: 13.5px/1.55 "Segoe UI Variable Text", "Segoe UI", system-ui, sans-serif; color: var(--fg); background: var(--bg); display: flex; flex-direction: column; overflow: hidden; }
  button, select, textarea { font: inherit; color: inherit; }
  header { display: flex; align-items: center; gap: 6px; padding: 8px 10px; border-bottom: 1px solid var(--line); flex: none; }
  #model { flex: 1; min-width: 0; background: var(--field); border: 1px solid var(--line); border-radius: 8px; padding: 4px 6px; font-size: 12.5px; outline: none; }
  #model option { background: var(--card); color: var(--fg); }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--muted); flex: none; }
  .dot.ok { background: #22c55e; } .dot.bad { background: #ef4444; }
  .ib { border: 0; background: none; border-radius: 7px; padding: 4px 8px; cursor: pointer; color: var(--muted); font-size: 12.5px; white-space: nowrap; }
  .ib:hover { background: var(--hover); color: var(--fg); }
  #log { flex: 1; overflow-y: auto; padding: 12px 12px 4px; scroll-behavior: auto; }
  .empty { text-align: center; color: var(--muted); padding: 8vh 8px 0; }
  .empty .spark { width: 40px; height: 40px; margin: 0 auto 10px; border-radius: 12px; display: grid; place-items: center; background: color-mix(in srgb, var(--accent) 16%, transparent); color: var(--accent); }
  .empty h2 { font-size: 15px; color: var(--fg); margin: 0 0 4px; font-weight: 600; }
  .empty p { margin: 0 0 14px; font-size: 12.5px; }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; justify-content: center; }
  .chips button { border: 1px solid var(--line); background: var(--card); border-radius: 999px; padding: 5px 11px; cursor: pointer; font-size: 12.5px; }
  .chips button:hover { border-color: color-mix(in srgb, var(--accent) 55%, transparent); }
  .help { text-align: left; background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; margin: 0 4px; color: var(--fg); }
  .help h3 { margin: 0 0 6px; font-size: 14px; }
  .help ol { margin: 6px 0 10px 18px; padding: 0; } .help li { margin: 3px 0; }
  .help code, .msg code { background: var(--code); border-radius: 5px; padding: 1px 5px; font-family: Consolas, "Cascadia Mono", monospace; font-size: 12px; }
  .primary { border: 0; background: var(--accent); color: #fff; border-radius: 8px; padding: 6px 14px; cursor: pointer; font-weight: 600; }
  .msg { margin: 0 0 14px; }
  .msg.user { display: flex; justify-content: flex-end; }
  .msg.user .b { background: color-mix(in srgb, var(--accent) 16%, var(--card)); border-radius: 14px 14px 4px 14px; padding: 7px 11px; max-width: 88%; white-space: pre-wrap; word-break: break-word; }
  .msg.user .ctx { display: block; font-size: 11.5px; color: var(--muted); margin-bottom: 2px; }
  .msg.ai .b { word-break: break-word; }
  .msg.ai .b > :first-child { margin-top: 0; } .msg.ai .b > :last-child { margin-bottom: 0; }
  .msg.ai p { margin: 0 0 8px; }
  .msg.ai ul, .msg.ai ol { margin: 0 0 8px; padding-left: 20px; } .msg.ai li { margin: 2px 0; }
  .msg.ai h1, .msg.ai h2, .msg.ai h3, .msg.ai h4 { font-size: 14px; margin: 10px 0 6px; }
  .msg.ai pre { background: var(--code); border-radius: 9px; padding: 9px 11px; overflow-x: auto; margin: 0 0 8px; }
  .msg.ai pre code { background: none; padding: 0; white-space: pre; }
  .msg.ai blockquote { margin: 0 0 8px; padding-left: 10px; border-left: 3px solid var(--line); color: var(--muted); }
  .msg.ai .err { color: #ef4444; }
  .think { font-size: 12px; color: var(--muted); margin-bottom: 6px; }
  .think summary { cursor: pointer; user-select: none; }
  .think div { white-space: pre-wrap; border-left: 2px solid var(--line); padding-left: 8px; margin-top: 4px; max-height: 200px; overflow-y: auto; }
  .tools { display: flex; gap: 2px; margin-top: 2px; opacity: 0; transition: opacity .12s; }
  .msg.ai:hover .tools { opacity: 1; }
  .tools button { border: 0; background: none; color: var(--muted); font-size: 11.5px; padding: 2px 6px; border-radius: 6px; cursor: pointer; }
  .tools button:hover { background: var(--hover); color: var(--fg); }
  .cursor::after { content: '▍'; color: var(--accent); animation: blink 1s steps(2) infinite; }
  @keyframes blink { 50% { opacity: 0; } }
  footer { flex: none; padding: 8px 10px 10px; border-top: 1px solid var(--line); }
  .opts { display: flex; align-items: center; gap: 6px; margin-bottom: 6px; font-size: 12px; color: var(--muted); min-width: 0; }
  #use-page { border: 1px solid var(--line); background: none; border-radius: 999px; padding: 2px 9px; cursor: pointer; color: var(--muted); font-size: 12px; white-space: nowrap; }
  #use-page.on { background: color-mix(in srgb, var(--accent) 16%, transparent); border-color: transparent; color: var(--accent); font-weight: 600; }
  #page-name { min-width: 0; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
  .box { display: flex; align-items: flex-end; gap: 6px; background: var(--field); border: 1px solid var(--line); border-radius: 12px; padding: 6px 6px 6px 10px; }
  .box:focus-within { border-color: color-mix(in srgb, var(--accent) 60%, transparent); }
  #q { flex: 1; resize: none; border: 0; outline: none; background: none; max-height: 160px; min-height: 22px; line-height: 1.45; padding: 2px 0; }
  #send { border: 0; width: 30px; height: 30px; border-radius: 9px; background: var(--accent); color: #fff; cursor: pointer; display: grid; place-items: center; flex: none; }
  #send:disabled { opacity: .4; cursor: default; }
  #send.stop { background: var(--fg); color: var(--bg); }
  .note { font-size: 11px; color: var(--muted); text-align: center; margin-top: 5px; }
</style>
</head>
<body>
<header>
  <span class="dot" id="dot" title="Ollama"></span>
  <select id="model" title="Model"></select>
  <button class="ib" id="new" title="Start over">New chat</button>
</header>
<div id="log"></div>
<footer>
  <div class="opts"><button id="use-page" class="on" title="Let the AI read the page you're on">Use this page</button><span id="page-name"></span></div>
  <div class="box">
    <textarea id="q" rows="1" placeholder="Ask anything…" spellcheck="true"></textarea>
    <button id="send" title="Send (Enter)" disabled><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19V5M5 12l7-7 7 7"/></svg></button>
  </div>
  <div class="note">Runs on your PC with Ollama — nothing leaves your computer.</div>
</footer>
<script>
const D = /*__DATA__*/null || {};
document.body.className = D.dark ? 'dark' : 'light';
if (D.accent) document.documentElement.style.setProperty('--accent', D.accent);
const $ = (s) => document.querySelector(s);
const H = { 'x-drift-ai': '1' };
const esc = (s) => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
let models = [], model = D.model || '', online = null;
let chat = [];          // { role, content, shown?, page? }
let busy = null;        // AbortController while the model is writing
let usePage = true;

// ---------------------------------------------------------------- markdown (small, safe)
function inline(s) {
  return s.replace(/`([^`]+)`/g, (_, c) => `<code>${c}</code>`)
    .replace(/\*\*([^*]+)\*\*/g, '<b>$1</b>')
    .replace(/(^|[^*])\*([^*\n]+)\*/g, '$1<i>$2</i>')
    .replace(/\[([^\]]+)\]\((https?:[^)\s]+)\)/g, '$1');
}
function md(src) {
  const lines = esc(src).split('\n'); let out = '', list = null, para = [];
  const flushP = () => { if (para.length) { out += `<p>${inline(para.join('<br>'))}</p>`; para = []; } };
  const flushL = () => { if (list) { out += `</${list}>`; list = null; } };
  for (let i = 0; i < lines.length; i++) {
    const l = lines[i];
    if (/^```/.test(l)) {
      flushP(); flushL(); const code = [];
      while (++i < lines.length && !/^```/.test(lines[i])) code.push(lines[i]);
      out += `<pre><code>${code.join('\n')}</code></pre>`; continue;
    }
    let m;
    if ((m = l.match(/^(#{1,4})\s+(.*)/))) { flushP(); flushL(); out += `<h${m[1].length}>${inline(m[2])}</h${m[1].length}>`; continue; }
    if ((m = l.match(/^\s*[-*•]\s+(.*)/))) { flushP(); if (list !== 'ul') { flushL(); out += '<ul>'; list = 'ul'; } out += `<li>${inline(m[1])}</li>`; continue; }
    if ((m = l.match(/^\s*\d+[.)]\s+(.*)/))) { flushP(); if (list !== 'ol') { flushL(); out += '<ol>'; list = 'ol'; } out += `<li>${inline(m[1])}</li>`; continue; }
    if ((m = l.match(/^&gt;\s?(.*)/))) { flushP(); flushL(); out += `<blockquote>${inline(m[1])}</blockquote>`; continue; }
    if (!l.trim()) { flushP(); flushL(); continue; }
    flushL(); para.push(l);
  }
  flushP(); flushL();
  return out;
}
// Thinking models write their reasoning first (in <think>…</think>, or separately): shown folded.
function splitThink(text) {
  const m = text.match(/^\s*<think>([\s\S]*?)(<\/think>|$)/);
  if (!m) return { think: '', answer: text, thinking: false };
  return { think: m[1].trim(), answer: text.slice(m[0].length), thinking: !m[2] };
}

// ---------------------------------------------------------------- rendering
function render() {
  const log = $('#log');
  if (online === false) {
    log.innerHTML = `<div class="empty"><div class="help"><h3>Ollama isn't running</h3>
      The AI panel uses <b>Ollama</b> on your PC. To start it:
      <ol><li>Open <b>Ollama</b> from the Start menu (it sits in the tray).</li><li>Come back here and press Retry.</li></ol>
      <button class="primary" id="retry">Retry</button></div></div>`;
    $('#retry').onclick = () => loadModels(); return;
  }
  if (online && !models.length) {
    log.innerHTML = `<div class="empty"><div class="help"><h3>No models yet</h3>
      Ollama is running but has no models. Open a terminal and download one, for example:
      <ol><li><code>ollama pull qwen3:14b</code> (smart, fits your graphics card)</li><li>or <code>ollama pull llama3.2</code> (small and quick)</li></ol>
      <button class="primary" id="retry">Retry</button></div></div>`;
    $('#retry').onclick = () => loadModels(); return;
  }
  if (!chat.length) {
    log.innerHTML = `<div class="empty"><div class="spark"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"><path d="M12 3.5l1.9 5.1 5.1 1.9-5.1 1.9L12 17.5l-1.9-5.1L5 10.5l5.1-1.9z"/></svg></div>
      <h2>Ask about this page, or anything</h2><p>${online === null ? 'Connecting to Ollama…' : 'Private and free — it runs on your own PC.'}</p>
      <div class="chips"><button data-p="summarize">Summarize this page</button><button data-p="points">Key points</button><button data-p="simple">Explain it simply</button><button data-p="questions">What should I ask?</button></div></div>`;
    log.querySelectorAll('[data-p]').forEach(b => b.onclick = () => preset(b.dataset.p));
    return;
  }
  log.innerHTML = chat.map((m, i) => {
    if (m.role === 'user') return `<div class="msg user"><div class="b">${m.page ? `<span class="ctx">About: ${esc(m.page)}</span>` : ''}${esc(m.shown || m.content)}</div></div>`;
    const { think, answer, thinking } = splitThink(m.content || '');
    const th = (m.thinking || think) ? `<details class="think"${thinking ? ' open' : ''}><summary>${thinking || (m.live && !answer.trim()) ? 'Thinking…' : 'Thought it through'}</summary><div>${esc((m.thinking || '') + think)}</div></details>` : '';
    const body = m.error ? `<p class="err">${esc(m.error)}</p>` : md(answer.trim());
    return `<div class="msg ai"><div class="b${m.live ? ' cursor' : ''}">${th}${body}</div>${!m.live && !m.error ? `<div class="tools"><button data-copy="${i}">Copy</button>${i === chat.length - 1 ? `<button data-redo="1">Try again</button>` : ''}</div>` : ''}</div>`;
  }).join('');
  log.querySelectorAll('[data-copy]').forEach(b => b.onclick = () => { navigator.clipboard.writeText(splitThink(chat[+b.dataset.copy].content).answer.trim()); b.textContent = 'Copied'; setTimeout(() => b.textContent = 'Copy', 1200); });
  const redo = log.querySelector('[data-redo]'); if (redo) redo.onclick = () => { const lastUser = [...chat].reverse().find(m => m.role === 'user'); chat = chat.slice(0, chat.lastIndexOf(lastUser)); send(lastUser.content, { shown: lastUser.shown, keepPage: true }); };
}
let stick = true;
$('#log').addEventListener('scroll', () => { const l = $('#log'); stick = l.scrollHeight - l.scrollTop - l.clientHeight < 40; });
const scrollDown = () => { if (stick) { const l = $('#log'); l.scrollTop = l.scrollHeight; } };

// ---------------------------------------------------------------- Ollama
async function loadModels() {
  online = null; render();
  try {
    const r = await (await fetch('drift://ai/models', { headers: H })).json();
    online = !!r.ok; models = r.models || [];
  } catch { online = false; models = []; }
  if (models.length && !models.some(m => m.name === model)) model = models[0].name;
  $('#model').innerHTML = models.map(m => `<option value="${esc(m.name)}"${m.name === model ? ' selected' : ''}>${esc(m.name)}${m.params ? ' · ' + esc(m.params) : ''}</option>`).join('') || '<option>No models</option>';
  $('#dot').className = 'dot ' + (online ? 'ok' : 'bad');
  $('#dot').title = online ? 'Ollama is running' : "Ollama isn't running";
  updateSend(); render();
  if (pendingTask && online && models.length) { const t = pendingTask; pendingTask = null; run(t.task, t.text); }
}
$('#model').onchange = () => { model = $('#model').value; fetch('drift://ai/model', { method: 'POST', headers: H, body: JSON.stringify({ model }) }); };

async function pageContext() {
  try { return await (await fetch('drift://ai/page', { headers: H })).json(); } catch { return null; }
}
async function showPageName() {
  if (!usePage) { $('#page-name').textContent = ''; return; }
  const p = await pageContext();
  $('#page-name').textContent = p && !p.none && p.text ? (p.title || p.url) : 'No page to read here';
}

async function send(text, opts = {}) {
  text = String(text || '').trim();
  if (!text || busy || !online || !model) return;
  let page = null;
  if (usePage) { page = await pageContext(); if (page && (page.none || !page.text)) page = null; }
  chat.push({ role: 'user', content: text, shown: opts.shown, page: page ? (page.title || page.url) : '' , pageText: page });
  const msgs = [];
  const sys = 'You are a helpful assistant built into the Drift web browser. Answer clearly and concisely. Use short paragraphs and bullet points where they help. Reply in the language the user writes in.';
  // The page goes in once, with the newest question that used it (it can change between questions).
  const lastWithPage = usePage ? [...chat].reverse().find(m => m.role === 'user' && m.pageText) : null;
  msgs.push({ role: 'system', content: sys + (lastWithPage ? `\n\nThe user is reading this web page. Use it to answer when relevant.\nTitle: ${lastWithPage.pageText.title}\nURL: ${lastWithPage.pageText.url}\n\nPage text:\n${lastWithPage.pageText.text}` : '') });
  for (const m of chat) if (!m.error) msgs.push({ role: m.role, content: m.role === 'assistant' ? splitThink(m.content).answer.trim() : m.content });
  const out = { role: 'assistant', content: '', thinking: '', live: true };
  chat.push(out); render(); stick = true; scrollDown();
  busy = new AbortController(); updateSend();
  try {
    const r = await fetch('drift://ai/chat', { method: 'POST', headers: H, body: JSON.stringify({ model, messages: msgs }), signal: busy.signal });
    if (!r.ok) { let e = ''; try { e = (await r.json()).error; } catch {} throw new Error(e === 'offline' ? "Couldn't reach Ollama — is it running?" : (e || 'The model stopped with an error.')); }
    const rd = r.body.getReader(), dec = new TextDecoder(); let buf = '', last = 0;
    for (;;) {
      const { done, value } = await rd.read(); if (done) break;
      buf += dec.decode(value, { stream: true });
      let nl;
      while ((nl = buf.indexOf('\n')) >= 0) {
        const line = buf.slice(0, nl).trim(); buf = buf.slice(nl + 1);
        if (!line) continue;
        let j; try { j = JSON.parse(line); } catch { continue; }
        if (j.error) throw new Error(j.error);
        if (j.message) { out.content += j.message.content || ''; out.thinking += j.message.thinking || ''; }
      }
      if (Date.now() - last > 50) { last = Date.now(); render(); scrollDown(); }
    }
  } catch (e) {
    if (e.name !== 'AbortError') out.error = e.message || String(e);
  }
  out.live = false; busy = null; updateSend(); render(); scrollDown();
}
function updateSend() {
  const b = $('#send');
  b.classList.toggle('stop', !!busy);
  b.title = busy ? 'Stop' : 'Send (Enter)';
  b.innerHTML = busy ? '<svg width="12" height="12" viewBox="0 0 24 24"><rect x="5" y="5" width="14" height="14" rx="2" fill="currentColor"/></svg>'
    : '<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19V5M5 12l7-7 7 7"/></svg>';
  b.disabled = !busy && (!$('#q').value.trim() || !online || !models.length);
}

// ---------------------------------------------------------------- input
const q = $('#q');
const grow = () => { q.style.height = 'auto'; q.style.height = Math.min(160, q.scrollHeight) + 'px'; };
q.addEventListener('input', () => { grow(); updateSend(); });
q.addEventListener('keydown', (e) => {
  if (e.key === 'Enter' && !e.shiftKey && !e.isComposing) { e.preventDefault(); go(); }
});
const go = () => { if (busy) { busy.abort(); return; } const t = q.value; q.value = ''; grow(); updateSend(); send(t); };
$('#send').onclick = go;
$('#new').onclick = () => { if (busy) busy.abort(); chat = []; render(); q.focus(); };
$('#use-page').onclick = () => { usePage = !usePage; $('#use-page').classList.toggle('on', usePage); showPageName(); };

const PRESETS = {
  summarize: ['Summarize this page.', 'Summarize this page in a few short paragraphs, then list the key takeaways as bullet points.'],
  points: ['Key points', 'List the key points of this page as short bullet points.'],
  simple: ['Explain it simply', 'Explain what this page is about in simple terms, as if to a friend who knows nothing about the topic.'],
  questions: ['What should I ask?', 'Suggest 5 good questions I could ask about this page, and briefly answer each.'],
};
function preset(k) { const [shown, prompt] = PRESETS[k]; if (!usePage) { usePage = true; $('#use-page').classList.add('on'); } send(prompt, { shown }); }
// Called by Drift: the page's right-click menu ("Summarize this page with AI", "Ask AI about this").
let pendingTask = null;
function run(task, text) {
  if (!online || !models.length) { pendingTask = { task, text }; return; }
  if (task === 'summarize') preset('summarize');
  else if (task === 'ask' && text) { q.value = `“${text}”\n\n`; grow(); updateSend(); q.focus(); q.setSelectionRange(q.value.length, q.value.length); q.placeholder = 'What do you want to know about it?'; }
}
window.driftAI = { run };
if (D.task) pendingTask = { task: D.task, text: D.text };
render(); loadModels(); showPageName();
setInterval(() => { if (!busy) showPageName(); }, 3000);
q.focus();
</script>
</body>
</html>

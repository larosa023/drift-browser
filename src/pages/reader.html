<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Reader</title>
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; img-src https: http: data:; media-src https: http:; style-src 'unsafe-inline'; script-src 'nonce-__NONCE__'">
<style>
  :root { --accent: #ff6a3d; --size: 19px; --width: 680px; }
  body.dark { --bg: #17171b; --fg: #e4e4ea; --muted: #8d8d99; --line: rgba(255,255,255,.09); --bar: #222228; --code: rgba(255,255,255,.06); }
  body.light { --bg: #fbfbfc; --fg: #1d1d23; --muted: #6b6b76; --line: rgba(0,0,0,.09); --bar: #ffffff; --code: rgba(0,0,0,.05); }
  body.sepia { --bg: #f4ecd8; --fg: #3b2f22; --muted: #7a6a55; --line: rgba(59,47,34,.14); --bar: #fbf4e3; --code: rgba(59,47,34,.07); }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body { background: var(--bg); color: var(--fg); font: var(--size)/1.7 "Segoe UI Variable Text", "Segoe UI", system-ui, sans-serif; transition: background .15s, color .15s; }
  body.serif { font-family: Georgia, "Iowan Old Style", "Times New Roman", serif; }
  .bar { position: sticky; top: 0; z-index: 2; display: flex; align-items: center; gap: 4px; justify-content: center; padding: 8px; background: color-mix(in srgb, var(--bg) 88%, transparent); backdrop-filter: blur(10px); border-bottom: 1px solid var(--line); font: 13px/1 "Segoe UI", system-ui, sans-serif; }
  .bar button { border: 0; background: transparent; color: var(--fg); font: inherit; height: 30px; min-width: 30px; padding: 0 10px; border-radius: 8px; cursor: pointer; }
  .bar button:hover { background: var(--code); }
  .bar button.on { color: var(--accent); font-weight: 600; }
  .bar .sep { width: 1px; height: 18px; background: var(--line); margin: 0 6px; }
  .bar .dot { width: 18px; height: 18px; min-width: 0; padding: 0; border-radius: 50%; box-shadow: inset 0 0 0 1px var(--line); }
  main { width: min(var(--width), 92vw); margin: 0 auto; padding: 44px 0 120px; }
  .site { color: var(--accent); font: 600 13px/1.4 "Segoe UI", system-ui, sans-serif; letter-spacing: .03em; text-transform: uppercase; text-decoration: none; }
  h1 { font-size: 1.85em; line-height: 1.2; margin: 10px 0 12px; letter-spacing: -.01em; }
  .meta { color: var(--muted); font: 14px/1.5 "Segoe UI", system-ui, sans-serif; margin-bottom: 34px; padding-bottom: 22px; border-bottom: 1px solid var(--line); }
  article img, article video, article figure { max-width: 100%; height: auto; border-radius: 8px; }
  article figure { margin: 1.4em 0; }
  article figcaption { color: var(--muted); font-size: .8em; line-height: 1.45; margin-top: 6px; }
  article a { color: var(--accent); text-decoration-thickness: 1px; text-underline-offset: 2px; }
  article h2, article h3, article h4 { line-height: 1.3; margin: 1.6em 0 .5em; }
  article blockquote { margin: 1.2em 0; padding: 2px 0 2px 18px; border-left: 3px solid var(--accent); color: var(--muted); }
  article pre, article code { font: .85em/1.5 "Cascadia Code", Consolas, ui-monospace, monospace; background: var(--code); border-radius: 6px; }
  article code { padding: 1px 5px; }
  article pre { padding: 12px 14px; overflow-x: auto; }
  article pre code { padding: 0; background: none; }
  article table { border-collapse: collapse; width: 100%; font-size: .85em; }
  article td, article th { border: 1px solid var(--line); padding: 6px 8px; text-align: left; }
  article hr { border: 0; border-top: 1px solid var(--line); margin: 2em 0; }
  .gone { text-align: center; color: var(--muted); padding-top: 20vh; font: 15px/1.6 "Segoe UI", system-ui, sans-serif; }
  .gone a { color: var(--accent); }
</style>
</head>
<body class="dark">
<div class="bar" id="bar">
  <button id="back" title="Back to the original page (Esc)">← Original</button>
  <span class="sep"></span>
  <button id="smaller" title="Smaller text">A−</button>
  <button id="bigger" title="Bigger text">A+</button>
  <span class="sep"></span>
  <button id="sans">Sans</button>
  <button id="serif">Serif</button>
  <span class="sep"></span>
  <button id="narrow" title="Narrower column">⇥⇤</button>
  <button id="wide" title="Wider column">⇤⇥</button>
  <span class="sep"></span>
  <button class="dot" id="t-light" title="Light" style="background:#fbfbfc"></button>
  <button class="dot" id="t-sepia" title="Sepia" style="background:#f4ecd8"></button>
  <button class="dot" id="t-dark" title="Dark" style="background:#17171b"></button>
</div>
<main id="main"></main>
<script nonce="__NONCE__">
  const D = /*__DATA__*/null;
  const $ = (id) => document.getElementById(id);
  document.documentElement.style.setProperty('--accent', D.accent || '#ff6a3d');
  let P = { size: 19, font: 'sans', width: 680, theme: D.dark ? 'dark' : 'light' };
  try { Object.assign(P, JSON.parse(localStorage.getItem('reader') || '{}')); } catch {}
  function apply() {
    document.body.className = P.theme + (P.font === 'serif' ? ' serif' : '');
    document.documentElement.style.setProperty('--size', P.size + 'px');
    document.documentElement.style.setProperty('--width', P.width + 'px');
    $('sans').classList.toggle('on', P.font !== 'serif'); $('serif').classList.toggle('on', P.font === 'serif');
    try { localStorage.setItem('reader', JSON.stringify(P)); } catch {}
  }
  const set = (k, v) => { P[k] = v; apply(); };
  $('smaller').onclick = () => set('size', Math.max(14, P.size - 1));
  $('bigger').onclick = () => set('size', Math.min(30, P.size + 1));
  $('sans').onclick = () => set('font', 'sans');
  $('serif').onclick = () => set('font', 'serif');
  $('narrow').onclick = () => set('width', Math.max(480, P.width - 80));
  $('wide').onclick = () => set('width', Math.min(1100, P.width + 80));
  $('t-light').onclick = () => set('theme', 'light');
  $('t-sepia').onclick = () => set('theme', 'sepia');
  $('t-dark').onclick = () => set('theme', 'dark');
  const back = () => { if (history.length > 1) history.back(); else if (D.url) location.href = D.url; };
  $('back').onclick = back;
  addEventListener('keydown', (e) => { if (e.key === 'Escape') back(); });
  const main = $('main');
  if (!D.article) {
    main.innerHTML = '<div class="gone">This article isn\'t in reader view any more.<br><a id="orig">Open the original page</a></div>';
    const o = $('orig'); o.href = D.url || '#';
  } else {
    const a = D.article;
    document.title = a.title || 'Reader';
    if (a.lang) document.documentElement.lang = a.lang;
    const head = document.createElement('header');
    const site = document.createElement('a'); site.className = 'site'; site.href = a.url; site.textContent = a.site;
    const h1 = document.createElement('h1'); h1.textContent = a.title;
    const meta = document.createElement('div'); meta.className = 'meta';
    const mins = Math.max(1, Math.round((a.words || 0) / 230));
    meta.textContent = [a.byline, mins + ' min read'].filter(Boolean).join(' · ');
    head.append(site, h1, meta);
    const art = document.createElement('article');
    art.innerHTML = a.html;   // cleaned by Drift (no scripts, handlers or styles); this page's rules block any script anyway
    // The article's own first heading is usually the title again.
    const first = art.querySelector('h1, h2');
    if (first && first.textContent.trim() === (a.title || '').trim()) first.remove();
    main.append(head, art);
  }
  apply();
</script>
</body>
</html>

<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>What's new in Drift</title>
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'">
<style>
  :root { --accent: #ff6a3d; }
  body.dark { --bg: #1b1b20; --fg: #ececf1; --muted: #8d8d99; --card: #222228; --line: rgba(255,255,255,.07); --chip: rgba(255,255,255,.06); }
  body.light { --bg: #fafafb; --fg: #1c1c22; --muted: #6b6b76; --card: #ffffff; --line: rgba(0,0,0,.07); --chip: rgba(0,0,0,.05); }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    font: 14px/1.55 "Segoe UI Variable Text", "Segoe UI", system-ui, sans-serif; color: var(--fg);
    background:
      radial-gradient(50% 40% at 18% 0%, color-mix(in srgb, var(--accent) 16%, transparent), transparent 70%),
      var(--bg);
    background-attachment: fixed;
    min-height: 100vh;
  }
  .wrap { width: min(680px, 90vw); margin: 0 auto; padding: 9vh 0 72px; }
  .eyebrow { color: var(--accent); font-weight: 600; font-size: 12.5px; letter-spacing: .04em; text-transform: uppercase; }
  h1 { font-size: 34px; font-weight: 600; letter-spacing: -.5px; margin: 6px 0 4px; line-height: 1.15; }
  .sub { color: var(--muted); margin: 0 0 32px; }
  .rel { background: var(--card); border-radius: 16px; padding: 20px 24px 18px; box-shadow: 0 0 0 1px var(--line), 0 10px 30px rgba(0,0,0,.10); margin-bottom: 14px; }
  .rel.old { background: transparent; box-shadow: none; padding: 14px 24px 6px; border-top: 1px solid var(--line); border-radius: 0; margin: 0; }
  .rel h2 { display: flex; align-items: baseline; gap: 10px; margin: 0 0 10px; font-size: 15px; font-weight: 600; }
  .rel.old h2 { font-size: 13.5px; color: var(--muted); }
  .rel h2 time { color: var(--muted); font-weight: 400; font-size: 12.5px; }
  ul { list-style: none; margin: 0; padding: 0; display: grid; gap: 10px; }
  .rel.old ul { gap: 6px; margin-bottom: 8px; }
  li { display: grid; grid-template-columns: 74px 1fr; gap: 12px; align-items: baseline; }
  .rel.old li { color: var(--muted); font-size: 13px; }
  .tag { justify-self: start; font-size: 11px; font-weight: 600; padding: 2px 8px; border-radius: 999px; background: var(--chip); color: var(--muted); }
  .tag.new { background: color-mix(in srgb, var(--accent) 18%, transparent); color: var(--accent); }
  .tag.faster { background: rgba(48, 164, 108, .16); color: #30a46c; }
  .tag.fixed { background: rgba(0, 144, 255, .14); color: #3d9df5; }
  .earlier { color: var(--muted); font-size: 12.5px; font-weight: 600; letter-spacing: .04em; text-transform: uppercase; margin: 34px 0 6px; }
  .actions { margin-top: 26px; display: flex; gap: 10px; }
  .btn { font: inherit; font-weight: 600; border: 0; border-radius: 10px; padding: 9px 18px; cursor: pointer; background: var(--accent); color: #fff; }
  .btn:hover { filter: brightness(1.08); }
  @media (max-width: 520px) { li { grid-template-columns: 1fr; gap: 2px; } h1 { font-size: 27px; } }
</style>
</head>
<body class="dark">
  <div class="wrap">
    <div class="eyebrow" id="eyebrow">What's new</div>
    <h1 id="title">What's new in Drift</h1>
    <p class="sub" id="sub"></p>
    <div id="fresh"></div>
    <div class="actions" id="actions"><button class="btn" id="done">Done</button></div>
    <div id="older"></div>
  </div>
<script>
  const D = /*__DATA__*/null || { entries: [], current: '', from: '', accent: '#ff6a3d', dark: true };
  document.body.className = D.dark ? 'dark' : 'light';
  document.documentElement.style.setProperty('--accent', D.accent);
  const LABEL = { new: 'New', faster: 'Faster', fixed: 'Fixed', changed: 'Changed' };
  const cmp = (a, b) => { const x = String(a).split('.').map(Number), y = String(b).split('.').map(Number); for (let i = 0; i < 3; i++) { if ((x[i] || 0) !== (y[i] || 0)) return (x[i] || 0) - (y[i] || 0); } return 0; };
  const fmtDate = (d) => { try { return new Date(d + 'T12:00:00').toLocaleDateString([], { month: 'long', day: 'numeric', year: 'numeric' }); } catch { return d; } };
  const el = (tag, cls, text) => { const e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; };
  const card = (r, old) => {
    const box = el('section', 'rel' + (old ? ' old' : ''));
    const h = el('h2'); h.append(el('span', '', 'Drift ' + r.version), el('time', '', fmtDate(r.date)));
    const ul = el('ul');
    for (const [kind, text] of r.items) { const li = el('li'); li.append(el('span', 'tag ' + kind, LABEL[kind] || kind), el('span', '', text)); ul.append(li); }
    box.append(h, ul); return box;
  };
  // Releases since the version you had before ("from"); everything else under Earlier updates.
  const fresh = D.from ? D.entries.filter(r => cmp(r.version, D.from) > 0 && cmp(r.version, D.current) <= 0) : [];
  if (fresh.length) {
    document.getElementById('eyebrow').textContent = 'Updated to ' + D.current;
    document.getElementById('title').textContent = "Here's what's new";
    document.getElementById('sub').textContent = fresh.length > 1 ? `${fresh.length} updates since you last opened Drift (${D.from}).` : 'Drift just updated. Here are the changes.';
    fresh.forEach(r => document.getElementById('fresh').append(card(r, false)));
  } else {
    document.getElementById('sub').textContent = 'Drift ' + D.current + ' · the latest changes';
    const first = D.entries.find(r => cmp(r.version, D.current) <= 0);
    if (first) document.getElementById('fresh').append(card(first, false));
  }
  const shown = new Set([...document.querySelectorAll('#fresh h2 span')].map(s => s.textContent));
  const rest = D.entries.filter(r => !shown.has('Drift ' + r.version) && cmp(r.version, D.current) <= 0);
  if (rest.length) {
    const older = document.getElementById('older');
    older.append(el('div', 'earlier', 'Earlier updates'));
    rest.forEach(r => older.append(card(r, true)));
  }
  document.getElementById('done').onclick = () => location.replace('drift://newtab/');
</script>
</body>
</html>

<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self'">
  <style>
    :root { --accent: #ff6a3d; }
    html, body { margin: 0; height: 100%; overflow: hidden; background: transparent; font: 13px/1.3 "Segoe UI Variable Text", "Segoe UI", system-ui, sans-serif; user-select: none; }
    #scrim { position: fixed; inset: 0; background: rgba(8, 8, 12, .5); animation: fade .16s ease-out; }
    #card { position: fixed; border-radius: 13px; box-shadow: 0 0 0 1px rgba(255,255,255,.08), 0 24px 70px rgba(0,0,0,.55); pointer-events: none; animation: fade .16s ease-out; }
    #bar { position: fixed; display: flex; align-items: center; gap: 8px; height: 36px; animation: rise .18s ease-out; }
    #info { flex: 1; min-width: 0; display: flex; flex-direction: column; justify-content: center; color: #fff; padding: 0 6px; }
    #title { font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    #url { opacity: .6; font-size: 11.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    button { all: unset; display: inline-flex; align-items: center; gap: 6px; height: 32px; padding: 0 13px; border-radius: 999px; cursor: pointer;
      background: rgba(255,255,255,.12); color: #fff; font-weight: 600; transition: background .12s; }
    button:hover { background: rgba(255,255,255,.2); }
    button.accent { background: var(--accent); } button.accent:hover { filter: brightness(1.08); background: var(--accent); }
    button.round { width: 32px; padding: 0; justify-content: center; }
    kbd { font: inherit; font-size: 11px; opacity: .65; font-weight: 500; }
    svg { width: 15px; height: 15px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
    .spin { width: 12px; height: 12px; border-radius: 50%; border: 2px solid rgba(255,255,255,.25); border-top-color: #fff; animation: spin .7s linear infinite; flex: none; }
    body.off { visibility: hidden; }
    @keyframes fade { from { opacity: 0; } }
    @keyframes rise { from { opacity: 0; transform: translateY(6px); } }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body class="off">
  <div id="scrim"></div>
  <div id="card"></div>
  <div id="bar" hidden>
    <span class="spin" id="spin" hidden></span>
    <div id="info"><span id="title"></span><span id="url"></span></div>
    <button id="expand" class="accent" title="Open as a tab (Ctrl+Enter)"><svg viewBox="0 0 24 24"><path d="M14 4h6v6M20 4l-8 8M10 4H6a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-4"/></svg>Open as tab</button>
    <button id="close" class="round" title="Close (Esc)"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
  </div>
  <script src="glance.js"></script>
</body>
</html>

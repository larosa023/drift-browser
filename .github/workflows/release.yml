# Builds the Windows installer and publishes it as a GitHub Release.
# Runs on every push to main; if a release for package.json's version already exists it
# does nothing. So to ship an update: bump "version" in package.json and push.
# Installed copies of Drift pick the new release up automatically.
name: Release

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Already released?
        id: check
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          EVS_ACCOUNT_NAME: ${{ secrets.EVS_ACCOUNT_NAME }}
          EVS_PASSWD: ${{ secrets.EVS_PASSWD }}
        run: |
          v=$(node -p "require('./package.json').version")
          echo "version=$v" >> "$GITHUB_OUTPUT"
          if gh release view "v$v" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "v$v is already released; nothing to do."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-node@v4
        if: steps.check.outputs.skip != 'true'
        with:
          node-version: 22
          cache: npm

      - run: npm ci
        if: steps.check.outputs.skip != 'true'

      # castlabs' signing tool, used by scripts/vmp-sign.js when EVS secrets are set.
      - run: pip install --quiet castlabs-evs
        if: steps.check.outputs.skip != 'true'

      - name: Build and publish v${{ steps.check.outputs.version }}
        if: steps.check.outputs.skip != 'true'
        run: npm run release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          EVS_ACCOUNT_NAME: ${{ secrets.EVS_ACCOUNT_NAME }}
          EVS_PASSWD: ${{ secrets.EVS_PASSWD }}
